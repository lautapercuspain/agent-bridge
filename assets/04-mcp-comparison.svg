<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="m_orb1" cx="0.3" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b1f8e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m_orb2" cx="0.75" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#0d6e6e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m_glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <filter id="m_noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#050505"/>
  <rect width="1200" height="800" fill="url(#m_orb1)"/>
  <rect width="1200" height="800" fill="url(#m_orb2)"/>
  <rect width="1200" height="800" filter="url(#m_noise)" opacity="0.025"/>

  <!-- Eyebrow + Title -->
  <text x="600" y="60" text-anchor="middle" font-family="'SF Pro Display', system-ui, sans-serif" font-size="9" fill="#7c3aed" letter-spacing="0.22em" font-weight="500">WHY IT MATTERS</text>
  <text x="600" y="105" text-anchor="middle" font-family="'SF Pro Display', system-ui, sans-serif" font-size="38" font-weight="600" fill="#f1f5f9" letter-spacing="-0.03em">Structured access, not screen scraping</text>

  <!-- LEFT: Without — browser chaos -->
  <g transform="translate(100, 160)">
    <!-- Outer shell -->
    <rect width="460" height="440" rx="28" fill="#0a0a14" stroke="#ef4444" stroke-width="0.5" stroke-opacity="0.15"/>
    <!-- Inner core -->
    <rect x="6" y="6" width="448" height="428" rx="22" fill="url(#m_glass)"/>

    <!-- Header -->
    <g transform="translate(32, 36)">
      <rect width="56" height="20" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="0.4" stroke-opacity="0.3"/>
      <text x="28" y="14" text-anchor="middle" font-family="'SF Pro Text', system-ui, sans-serif" font-size="8.5" fill="#f87171" letter-spacing="0.1em" font-weight="500">TODAY</text>
    </g>
    <text x="32" y="85" font-family="'SF Pro Display', system-ui, sans-serif" font-size="20" font-weight="600" fill="#f1f5f9" letter-spacing="-0.01em">Browser Automation</text>

    <!-- Fake browser window -->
    <g transform="translate(32, 110)">
      <rect width="396" height="180" rx="12" fill="#0c0c16" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
      <!-- Chrome bar -->
      <rect width="396" height="28" rx="12" fill="#0f0f1a"/>
      <circle cx="16" cy="14" r="4" fill="#ef4444" opacity="0.4"/>
      <circle cx="30" cy="14" r="4" fill="#eab308" opacity="0.3"/>
      <circle cx="44" cy="14" r="4" fill="#22c55e" opacity="0.3"/>
      <rect x="70" y="6" width="200" height="16" rx="4" fill="#0c0c16"/>
      <text x="100" y="18" font-family="'SF Mono', monospace" font-size="8" fill="#475569">foodapp.com/search?q=...</text>

      <!-- Broken elements inside -->
      <rect x="16" y="40" width="80" height="10" rx="2" fill="#1e1e2e" opacity="0.5"/>
      <rect x="16" y="56" width="120" height="8" rx="2" fill="#1e1e2e" opacity="0.3"/>
      <rect x="16" y="74" width="110" height="70" rx="6" fill="#1e1e2e" opacity="0.3"/>
      <rect x="140" y="74" width="110" height="70" rx="6" fill="#1e1e2e" opacity="0.3"/>
      <rect x="264" y="74" width="110" height="70" rx="6" fill="#1e1e2e" opacity="0.3"/>

      <!-- Red X marks -->
      <g stroke="#ef4444" stroke-width="1.5" opacity="0.5">
        <line x1="66" y1="98" x2="76" y2="108"/>
        <line x1="76" y1="98" x2="66" y2="108"/>
        <line x1="188" y1="98" x2="198" y2="108"/>
        <line x1="198" y1="98" x2="188" y2="108"/>
      </g>

      <!-- Error popup -->
      <rect x="200" y="35" width="180" height="28" rx="6" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="214" y="53" font-family="'SF Mono', monospace" font-size="9" fill="#f87171">Selector not found</text>
    </g>

    <!-- Pain points -->
    <g transform="translate(32, 315)" font-family="'SF Pro Text', system-ui, sans-serif" font-size="13" fill="#94a3b8" font-weight="300">
      <g>
        <text x="0" y="0" fill="#ef4444" font-size="11">&#x2717;</text>
        <text x="18" y="0">Fragile CSS selectors break constantly</text>
      </g>
      <g transform="translate(0, 28)">
        <text x="0" y="0" fill="#ef4444" font-size="11">&#x2717;</text>
        <text x="18" y="0">No semantic understanding of pages</text>
      </g>
      <g transform="translate(0, 56)">
        <text x="0" y="0" fill="#ef4444" font-size="11">&#x2717;</text>
        <text x="18" y="0">Slow, unreliable, not scalable</text>
      </g>
      <g transform="translate(0, 84)">
        <text x="0" y="0" fill="#ef4444" font-size="11">&#x2717;</text>
        <text x="18" y="0">Custom code per store</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: With AgentBridge -->
  <g transform="translate(640, 160)">
    <rect width="460" height="440" rx="28" fill="#0a0a14" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.15"/>
    <rect x="6" y="6" width="448" height="428" rx="22" fill="url(#m_glass)"/>

    <!-- Header -->
    <g transform="translate(32, 36)">
      <rect width="100" height="20" rx="10" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="0.4" stroke-opacity="0.3"/>
      <text x="50" y="14" text-anchor="middle" font-family="'SF Pro Text', system-ui, sans-serif" font-size="8.5" fill="#4ade80" letter-spacing="0.1em" font-weight="500">AGENTBRIDGE</text>
    </g>
    <text x="32" y="85" font-family="'SF Pro Display', system-ui, sans-serif" font-size="20" font-weight="600" fill="#f1f5f9" letter-spacing="-0.01em">Structured MCP</text>

    <!-- Code terminal -->
    <g transform="translate(32, 110)">
      <rect width="396" height="180" rx="12" fill="#0c0c16" stroke="#22c55e" stroke-width="0.3" stroke-opacity="0.08"/>
      <!-- Terminal header -->
      <rect width="396" height="28" rx="12" fill="#0f0f1a"/>
      <text x="16" y="18" font-family="'SF Mono', monospace" font-size="9" fill="#4ade80" opacity="0.6">MCP Tools</text>

      <!-- Code lines -->
      <g transform="translate(16, 42)" font-family="'SF Mono', 'Geist Mono', monospace" font-size="11.5">
        <text y="0" fill="#7c3aed">search_meals</text><text y="0" x="100" fill="#475569">(</text><text y="0" x="106" fill="#67e8f9">"poke bowl"</text><text y="0" x="190" fill="#475569">)</text>
        <text y="24" fill="#475569">  budget: </text><text y="24" x="65" fill="#c4b5fd">20</text><text y="24" x="78" fill="#475569">, delivery: </text><text y="24" x="145" fill="#c4b5fd">true</text>

        <text y="56" fill="#4ade80">// Response: 3 results</text>
        <text y="80" fill="#7c3aed">create_order</text><text y="80" x="94" fill="#475569">(</text>
        <text y="100" fill="#475569">  item: </text><text y="100" x="48" fill="#67e8f9">"Aloha Bowl"</text>
        <text y="120" fill="#475569">  total: </text><text y="120" x="48" fill="#c4b5fd">$17.98</text>
        <text y="120" x="95" fill="#475569">)</text>
      </g>
    </g>

    <!-- Benefits -->
    <g transform="translate(32, 315)" font-family="'SF Pro Text', system-ui, sans-serif" font-size="13" fill="#94a3b8" font-weight="300">
      <g>
        <text x="0" y="0" fill="#22c55e" font-size="11">&#x2713;</text>
        <text x="18" y="0">Semantic, structured actions</text>
      </g>
      <g transform="translate(0, 28)">
        <text x="0" y="0" fill="#22c55e" font-size="11">&#x2713;</text>
        <text x="18" y="0">Reliable, predictable responses</text>
      </g>
      <g transform="translate(0, 56)">
        <text x="0" y="0" fill="#22c55e" font-size="11">&#x2713;</text>
        <text x="18" y="0">Works across all connected stores</text>
      </g>
      <g transform="translate(0, 84)">
        <text x="0" y="0" fill="#22c55e" font-size="11">&#x2713;</text>
        <text x="18" y="0">Agent-native, zero UI dependency</text>
      </g>
    </g>
  </g>

  <!-- Bottom statement -->
  <g transform="translate(600, 665)">
    <text x="0" y="0" text-anchor="middle" font-family="'SF Pro Display', system-ui, sans-serif" font-size="18" fill="#f1f5f9" font-weight="400" letter-spacing="-0.01em">The web was built for humans clicking buttons.</text>
    <text x="0" y="30" text-anchor="middle" font-family="'SF Pro Display', system-ui, sans-serif" font-size="18" fill="#a78bfa" font-weight="400" letter-spacing="-0.01em">AgentBridge makes it work for AI agents.</text>
  </g>
</svg>
