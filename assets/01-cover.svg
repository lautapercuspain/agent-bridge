<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="orb1" cx="0.25" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#3b1f8e" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#1a0a3e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.78" cy="0.6" r="0.45">
      <stop offset="0%" stop-color="#0d6e6e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.4" r="0.28">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#050505"/>
  <rect width="1200" height="800" fill="url(#orb1)"/>
  <rect width="1200" height="800" fill="url(#orb2)"/>
  <rect width="1200" height="800" fill="url(#centerGlow)"/>
  <rect width="1200" height="800" filter="url(#noise)" opacity="0.025"/>

  <!-- Abstract orbital mark -->
  <g transform="translate(600, 295)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="100" ry="34" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.45" transform="rotate(-10)"/>
    <ellipse cx="0" cy="0" rx="72" ry="25" fill="none" stroke="url(#ringGrad)" stroke-width="0.7" opacity="0.25" transform="rotate(14)"/>
    <circle cx="0" cy="0" r="5.5" fill="#7c3aed" opacity="0.85"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#7c3aed" stroke-width="0.4" opacity="0.35"/>
    <circle cx="-82" cy="-12" r="2.5" fill="#06b6d4" opacity="0.6"/>
    <circle cx="78" cy="8" r="2.5" fill="#06b6d4" opacity="0.6"/>
    <circle cx="-35" cy="26" r="2" fill="#a78bfa" opacity="0.4"/>
    <circle cx="45" cy="-22" r="1.8" fill="#a78bfa" opacity="0.35"/>
    <line x1="-82" y1="-12" x2="-5" y2="0" stroke="#06b6d4" stroke-width="0.4" opacity="0.2"/>
    <line x1="78" y1="8" x2="5" y2="0" stroke="#06b6d4" stroke-width="0.4" opacity="0.2"/>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(600, 392)">
    <rect x="-66" y="-11" width="132" height="22" rx="11" fill="none" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.1"/>
    <text x="0" y="3.5" text-anchor="middle" font-family="'SF Pro Display', system-ui, sans-serif" font-size="8.5" fill="#a78bfa" letter-spacing="0.22em" font-weight="500">AGENT-NATIVE</text>
  </g>

  <!-- Title -->
  <text x="600" y="470" text-anchor="middle" font-family="'SF Pro Display', system-ui, sans-serif" font-size="76" font-weight="700" fill="#f8fafc" letter-spacing="-0.04em">AgentBridge</text>

  <!-- Subtitle -->
  <text x="600" y="515" text-anchor="middle" font-family="'SF Pro Text', system-ui, sans-serif" font-size="17.5" fill="#94a3b8" font-weight="300" letter-spacing="0.03em">Commerce infrastructure for AI agents</text>

  <!-- Flow bar -->
  <g transform="translate(600, 635)">
    <line x1="-320" y1="0" x2="320" y2="0" stroke="url(#accentLine)" stroke-width="0.8"/>
    <g font-family="'SF Pro Text', system-ui, sans-serif" font-size="10.5" font-weight="400" letter-spacing="0.06em" text-anchor="middle">
      <g transform="translate(-280, 0)">
        <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.07"/>
        <text y="4" fill="#64748b">Human</text>
      </g>
      <g transform="translate(-140, 0)">
        <rect x="-44" y="-16" width="88" height="32" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.07"/>
        <text y="4" fill="#64748b">AI Agent</text>
      </g>
      <g transform="translate(0, 0)">
        <rect x="-52" y="-16" width="104" height="32" rx="16" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="0.6" stroke-opacity="0.35"/>
        <text y="4" fill="#c4b5fd" font-weight="500">AgentBridge</text>
      </g>
      <g transform="translate(140, 0)">
        <rect x="-30" y="-16" width="60" height="32" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.07"/>
        <text y="4" fill="#64748b">MCP</text>
      </g>
      <g transform="translate(280, 0)">
        <rect x="-36" y="-16" width="72" height="32" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.07"/>
        <text y="4" fill="#64748b">Stores</text>
      </g>
    </g>
    <circle cx="-210" cy="0" r="1.2" fill="#7c3aed" opacity="0.4"/>
    <circle cx="-70" cy="0" r="1.2" fill="#7c3aed" opacity="0.5"/>
    <circle cx="70" cy="0" r="1.2" fill="#06b6d4" opacity="0.4"/>
    <circle cx="210" cy="0" r="1.2" fill="#06b6d4" opacity="0.3"/>
  </g>

  <!-- Bottom mark -->
  <text x="600" y="740" text-anchor="middle" font-family="'SF Pro Text', system-ui, sans-serif" font-size="9" fill="#374151" font-weight="300" letter-spacing="0.18em">WEBMCP HACKATHON 2026</text>
</svg>
